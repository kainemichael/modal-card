<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <section class="hero">
            <div class="card">
                <div class="illustration_wrapper">
                 <img class="illustration" src="image.png" alt="">
                </div>
     
                 <div class="content">
                     <h2 class="heading">
                         Your action plan is ready
                     </h2>
                     <p class="description">
                         Superpower has analyzed your lab results and built
                         a precise action plan, tailored to you.
                     </p>
                 </div>
     
                 <div class="btn_wrapper">
                     <button class="primary_btn">
                         Take me to my action plan
                     </button>
     
                     <button class="secondary_btn">
                         I'm not interested right now
                     </button>
                 </div>
             </div>
        </section>
    </body>
</html>
