<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="style.css">
        <Title>Modal</Title>
    </head>

    <body>
        <section class="hero">
            <div class="card_contain">
                <div class="card">
                    <div class="illustration_wrapper">
                     <img class="illustration" src="image.png" alt="">
                    </div>
         
                     <div class="content">
                         <h2 class="heading">
                             Your action plan is ready
                         </h2>
                         <p class="description">
                             Superpower has analyzed your lab results and built
                             a precise action plan, tailored to you.
                         </p>
                     </div>
         
                     <div class="btn_wrapper">
                         <button class="primary_btn">
                             Take me to my action plan
                         </button>
         
                         <button class="secondary_btn">
                             I'm not interested right now
                         </button>
                     </div>
                 </div>
            </div>

             <div class="links_wrapper">
                <a href="#" target="_blank" class="links">Privacy Policy</a>
                <a href="#" target="_blank" class="links">Terms of Service</a>
                <a href="#" target="_blank" class="links">Socials</a>
             </div>
        </section>
    </body>
</html>
